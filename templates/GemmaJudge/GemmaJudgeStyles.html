<style>
    :root {
        --bg: #0d1117;
        --bg-elevated: #0f1115;
        --surface: #161b22;
        --surface-soft: #1c2128;
        --surface-muted: rgba(255, 255, 255, 0.03);
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(249, 115, 22, 0.25);
        --text: #e2e8f0;
        --text-dim: #94a3b8;
        --text-soft: #64748b;
        --accent: #f97316;
        --accent-deep: #dc2626;
        --accent-blue: #60a5fa;
        --success: #22c55e;
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        --radius: 22px;
        --radius-sm: 12px;
        --font-sans: "Inter", "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", "Consolas", monospace;
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        height: 100%;
        margin: 0;
        background:
            radial-gradient(circle at top left, rgba(249, 115, 22, 0.12), transparent 26%),
            radial-gradient(circle at top right, rgba(96, 165, 250, 0.12), transparent 20%),
            linear-gradient(180deg, #0f1115 0%, #0b1016 100%);
        color: var(--text);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
    }

    body {
        height: 100vh;
        min-height: 100vh;
        overflow: hidden;
    }

    button,
    input,
    select {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    .oracle-shell {
        height: 100vh;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .oracle-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        gap: 1.5rem;
        padding: 1rem 1.75rem;
        border-bottom: 1px solid var(--line);
        background: rgba(22, 27, 34, 0.88);
        backdrop-filter: blur(20px);
        position: sticky;
        top: 0;
        z-index: 20;
    }

    .brand-lockup {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        min-width: 0;
    }

    .brand-copy,
    .brand-copy-block,
    .brand-copy-wrapper,
    .brand-lockup > :not(.brand-mark) {
        min-width: 0;
        padding-left: 0.75rem;
    }

    .brand-mark {
        width: 3.15rem;
        height: 3.15rem;
        border-radius: 0.95rem;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: rgba(10, 14, 20, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 18px 35px rgba(0, 0, 0, 0.28);
        flex: 0 0 auto;
    }

    .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .eyebrow,
    .section-heading span,
    .toolbar-label,
    .toolbar-meta,
    .input-hint,
    .control-group span:first-child {
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 0.68rem;
    }

    .eyebrow,
    .section-heading span,
    .toolbar-meta,
    .control-group span:first-child {
        color: var(--text-soft);
        margin: 0 0 0.2rem;
    }

    .brand-lockup h1 {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 650;
        letter-spacing: -0.03em;
    }

    .response-mode-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        margin-top: 0.7rem;
        padding: 0.25rem;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
    }

    .mode-toggle-button {
        border: 0;
        border-radius: 999px;
        padding: 0.45rem 0.85rem;
        background: transparent;
        color: var(--text-dim);
        font-family: var(--font-mono);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .mode-toggle-button.is-active {
        background: linear-gradient(135deg, rgba(249, 115, 22, 0.18), rgba(220, 38, 38, 0.18));
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(249, 115, 22, 0.18);
    }

    .header-center {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .header-controls {
        display: flex;
        align-items: center;
        gap: 1.25rem;
        flex-wrap: wrap;
        justify-content: flex-end;
        min-width: 0;
    }

    .control-group {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.35rem 0.45rem 0.35rem 0.8rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.03);
    }

    .control-group select {
        border: 0;
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--accent);
        padding: 0.45rem 0.8rem;
        min-width: 11rem;
        outline: none;
    }

    .status-cluster {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
    }

    .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.55rem 0.85rem;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.025);
        color: var(--text-dim);
        font-family: var(--font-mono);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
    }

    .status-glyph,
    .signal-dot,
    .empty-icon,
    .hero-mark {
        display: inline-grid;
        place-items: center;
    }

    .signal-dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
    }

    .signal-dot.is-live {
        background: var(--success);
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.45);
        animation: pulse 1.8s infinite;
    }

    .status-glyph {
        width: 1.35rem;
        height: 1.35rem;
        border-radius: 0.45rem;
        background: rgba(249, 115, 22, 0.15);
        color: var(--accent);
        font-size: 0.65rem;
        font-weight: 700;
    }

    .oracle-workspace {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(18rem, 22rem) minmax(0, 1fr);
        min-height: 0;
        overflow: hidden;
    }

    .oracle-sidebar,
    .oracle-main,
    .reasoning-panel,
    .intelligence-panel,
    .search-results {
        min-height: 0;
    }

    .oracle-sidebar {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: rgba(13, 17, 23, 0.92);
        overflow-x: hidden;
        overflow-y: auto;
    }

    .sidebar-section {
        padding: 1.35rem 1.25rem 0;
    }

    .sidebar-section.grow {
        display: flex;
        flex-direction: column;
        flex: 1 0 18rem;
        min-height: 18rem;
        overflow: visible;
    }

    .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.85rem;
    }

    .section-heading.with-rule {
        margin-bottom: 1.35rem;
    }

    .selected-card-panel,
    .context-card,
    .query-form,
    .analysis-card,
    .result-card,
    .rule-card {
        border: 1px solid var(--line);
    }

    .selected-card-panel {
        min-height: 11rem;
        border-radius: 1rem;
        background: linear-gradient(180deg, rgba(28, 33, 40, 0.98), rgba(20, 24, 31, 0.98));
        padding: 1rem;
        position: relative;
        overflow: hidden;
    }

    .selected-card-panel::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 0.32rem;
        background: var(--card-accent, rgba(255, 255, 255, 0.1));
    }

    .selected-card-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.6rem;
    }

    .selected-card-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(4.7rem, 1fr));
        gap: 0.65rem;
        margin-bottom: 1rem;
    }

    .selected-card-thumb {
        border: 1px solid transparent;
        border-radius: 0.85rem;
        background: rgba(255, 255, 255, 0.03);
        padding: 0.2rem;
        overflow: hidden;
    }

    .selected-card-thumb img,
    .selected-card-image img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 0.7rem;
    }

    .selected-card-thumb.is-active {
        border-color: rgba(249, 115, 22, 0.32);
        box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.18);
    }

    .selected-card-body {
        display: grid;
        grid-template-columns: minmax(6rem, 8rem) minmax(0, 1fr);
        grid-template-areas:
            "aside main"
            "rulings rulings";
        gap: 1rem;
        align-items: start;
    }

    .selected-card-aside {
        grid-area: aside;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        min-width: 0;
    }

    .selected-card-main {
        grid-area: main;
        min-width: 0;
    }

    .selected-card-image {
        border-radius: 0.9rem;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
    }

    .card-clear {
        border: 0;
        width: 1.8rem;
        height: 1.8rem;
        border-radius: 0.55rem;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-dim);
    }

    .card-clear:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
    }

    .selected-card-header h3 {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.15;
    }

    .selected-card-meta,
    .rule-id,
    .pt-chip,
    .external-link,
    .rule-title,
    .result-meta {
        font-family: var(--font-mono);
    }

    .selected-card-meta {
        font-size: 0.72rem;
        color: var(--text-dim);
    }

    .selected-card-type {
        margin: 0;
        color: var(--text-soft);
        font-size: 0.82rem;
        font-style: italic;
    }

    .selected-card-text {
        margin: 0;
        color: var(--text);
        line-height: 1.55;
        font-size: 0.92rem;
        max-height: clamp(10rem, 24vh, 14rem);
        overflow-y: auto;
        padding-right: 0.35rem;
    }

    .selected-card-text p {
        margin: 0 0 0.65rem;
    }

    .selected-card-text p:last-child {
        margin-bottom: 0;
    }

    .selected-card-footer {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.55rem;
    }

    .selected-card-rulings {
        grid-area: rulings;
        padding-top: 0.85rem;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        max-height: clamp(8rem, 22vh, 12rem);
        overflow-y: auto;
        padding-right: 0.35rem;
        min-width: 0;
    }

    .selected-card-rulings h4 {
        margin: 0 0 0.55rem;
        font-size: 0.74rem;
        color: var(--text-soft);
        font-family: var(--font-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    .selected-card-rulings p {
        margin: 0 0 0.55rem;
        font-size: 0.82rem;
        line-height: 1.45;
        color: var(--text-dim);
    }

    .selected-card-rulings p:last-child {
        margin-bottom: 0;
    }

    .external-link {
        color: var(--accent);
        text-decoration: none;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
    }

    .pt-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 999px;
        padding: 0.35rem 0.7rem;
        color: var(--text-dim);
        font-size: 0.68rem;
        letter-spacing: 0.08em;
    }

    .search-frame {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.8rem 0.95rem;
        border: 1px solid var(--line);
        border-radius: 0.95rem;
        background: rgba(28, 33, 40, 0.96);
        margin-bottom: 0.95rem;
    }

    .search-glyph {
        color: var(--text-soft);
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    .search-frame input {
        width: 100%;
        background: transparent;
        border: 0;
        color: var(--text);
        outline: none;
    }

    .search-frame input::placeholder,
    .query-form input::placeholder {
        color: var(--text-soft);
    }

    .search-results {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        gap: 0.6rem;
        min-height: 0;
        max-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        padding-right: 0.2rem;
    }

    .result-card,
    .rule-card {
        width: 100%;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 0.95rem;
        padding: 0.8rem;
        color: inherit;
        text-align: left;
        transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
    }

    .result-card {
        display: flex;
        align-items: flex-start;
        gap: 0.8rem;
    }

    .result-card:hover,
    .result-card:focus-visible {
        border-color: rgba(249, 115, 22, 0.3);
        background: rgba(255, 255, 255, 0.05);
        transform: translateY(-1px);
        outline: none;
    }

    .result-card.is-selected {
        border-color: rgba(249, 115, 22, 0.35);
        background: rgba(249, 115, 22, 0.08);
    }

    .result-swatch {
        width: 0.3rem;
        min-width: 0.3rem;
        height: 2.7rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
    }

    .result-title {
        margin: 0 0 0.18rem;
        font-size: 0.92rem;
        font-weight: 650;
    }

    .result-meta {
        margin: 0;
        color: var(--text-soft);
        font-size: 0.66rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
    }

    .rule-card {
        padding: 0.9rem;
    }

    .rule-id {
        display: inline-block;
        margin-bottom: 0.45rem;
        color: var(--accent);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.16em;
    }

    .rule-title {
        margin: 0 0 0.35rem;
        color: var(--text-dim);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    .rule-card p {
        margin: 0;
        color: var(--text-dim);
        font-size: 0.82rem;
        line-height: 1.45;
    }

    .sidebar-footer {
        margin-top: auto;
        display: flex;
        gap: 0.8rem;
        align-items: flex-start;
        padding: 1rem 1.25rem 1.2rem;
        background: rgba(59, 130, 246, 0.06);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .footer-accent {
        width: 0.45rem;
        height: 0.45rem;
        margin-top: 0.28rem;
        border-radius: 999px;
        background: var(--accent-blue);
        flex: 0 0 auto;
    }

    .sidebar-footer p {
        margin: 0;
        color: #bfdbfe;
        font-size: 0.78rem;
        line-height: 1.45;
    }

    .oracle-main {
        display: flex;
        flex-direction: column;
        padding: 1.6rem;
        gap: 1.5rem;
        overflow: hidden;
    }

    .query-strip {
        flex: 0 0 auto;
    }

    .query-form {
        display: flex;
        align-items: center;
        gap: 1rem;
        max-width: 72rem;
        margin: 0 auto;
        padding: 0.95rem 1rem 0.95rem 1.2rem;
        border-radius: 1.2rem;
        background: linear-gradient(180deg, rgba(28, 33, 40, 0.98), rgba(20, 24, 31, 0.98));
        box-shadow: var(--shadow);
    }

    .query-form input {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--text);
        font-size: 1rem;
        outline: none;
    }

    .query-actions {
        display: flex;
        align-items: center;
        gap: 0.8rem;
    }

    .input-hint {
        color: var(--text-dim);
        padding: 0.45rem 0.7rem;
        border-radius: 0.6rem;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.04);
    }

    #submit-question,
    .secondary-button,
    .ghost-button {
        border: 0;
        border-radius: 0.9rem;
        transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    #submit-question {
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
        color: #fff;
        padding: 0.85rem 1rem;
        font-weight: 650;
        min-width: 5rem;
        box-shadow: 0 12px 30px rgba(249, 115, 22, 0.22);
    }

    #submit-question:hover,
    .secondary-button:hover,
    .ghost-button:hover {
        transform: translateY(-1px);
    }

    #submit-question:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    .analysis-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-radius: var(--radius);
        background: rgba(22, 27, 34, 0.95);
        box-shadow: var(--shadow);
        overflow: hidden;
    }

    .analysis-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.95rem 1.2rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        background: rgba(255, 255, 255, 0.02);
    }

    .toolbar-group {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        flex-wrap: wrap;
    }

    .toolbar-group-right {
        justify-content: flex-end;
    }

    .toolbar-label {
        color: var(--text-dim);
        margin: 0;
    }

    .loading-badge {
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        animation: pulse-text 1.1s infinite alternate;
    }

    .toolbar-meta {
        color: var(--text-soft);
    }

    .ghost-button {
        background: transparent;
        color: var(--text-dim);
        border: 1px solid var(--line);
        padding: 0.55rem 0.8rem;
    }

    .analysis-grid {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(18rem, 2fr);
        min-height: 0;
    }

    .reasoning-panel,
    .intelligence-panel {
        overflow-y: auto;
        padding: 1.65rem;
    }

    .reasoning-panel {
        border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .intelligence-panel {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        background: rgba(0, 0, 0, 0.18);
    }

    #messages-panel,
    #search-results,
    .sidebar-section.grow,
    .intelligence-panel {
        min-height: 0;
    }

    #messages-panel {
        overflow-x: hidden;
        overflow-y: auto;
    }

    #search-results {
        flex: 1 1 auto;
    }

    .empty-state {
        display: grid;
        place-items: center;
        gap: 0.7rem;
        min-height: 100%;
        text-align: center;
        color: var(--text-soft);
        border: 1px dashed rgba(255, 255, 255, 0.08);
        border-radius: 1rem;
        padding: 1.4rem;
        background: rgba(255, 255, 255, 0.02);
    }

    .empty-state.compact {
        min-height: 8.5rem;
    }

    .empty-state.hero {
        min-height: min(28rem, 60vh);
        border-style: solid;
        background:
            radial-gradient(circle at top center, rgba(249, 115, 22, 0.12), transparent 28%),
            rgba(255, 255, 255, 0.02);
    }

    .empty-state h2,
    .empty-state p {
        margin: 0;
    }

    .empty-state.hero h2 {
        font-size: 1.45rem;
        font-weight: 450;
        margin-bottom: 0.3rem;
    }

    .hero-logo {
        display: block;
        width: min(14rem, 42vw);
        max-width: 100%;
        height: auto;
    }

    .empty-icon,
    .hero-mark {
        width: 2.1rem;
        height: 2.1rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-dim);
        font-family: var(--font-mono);
        font-size: 0.8rem;
    }

    .hero-mark {
        width: 4rem;
        height: 4rem;
        border-radius: 1.25rem;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        color: var(--accent);
        border-color: rgba(249, 115, 22, 0.18);
        background: rgba(249, 115, 22, 0.08);
    }

    .message-stack {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        max-width: 56rem;
        margin: 0 auto;
    }

    .message-row {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
    }

    .message-row.is-user {
        align-items: flex-end;
    }

    .message-row.is-model {
        align-items: flex-start;
    }

    .message-label {
        color: var(--text-soft);
        font-family: var(--font-mono);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.18em;
    }

    .message-bubble {
        border-radius: 1rem;
        max-width: min(42rem, 100%);
        padding: 1rem 1.1rem;
        line-height: 1.6;
        color: var(--text);
    }

    .message-row.is-user .message-bubble {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.05);
        color: #dbe7f6;
